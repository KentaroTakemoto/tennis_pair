<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b45">
  <title>テニス組み合わせ</title>
  <style>
    :root {
      color-scheme: light;
      --green: #176b45;
      --green-dark: #0d4f32;
      --green-soft: #e8f4ed;
      --ink: #17231d;
      --muted: #637069;
      --line: #d8e1dc;
      --paper: #fff;
      --bg: #f4f7f5;
      --danger: #b42318;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }
    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: env(safe-area-inset-top) 14px calc(32px + env(safe-area-inset-bottom));
    }
    header { padding: 22px 4px 12px; }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); letter-spacing: .02em; }
    header p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 3px 16px rgba(25, 55, 39, .05);
    }
    .panel-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    h2 { margin: 0; font-size: 19px; }
    .count { color: var(--green); font-weight: 700; }
    .member-list { display: grid; gap: 8px; }
    .member {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      min-height: 46px;
      padding: 4px 4px 4px 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
    }
    .member.inactive { background: #f4f4f4; color: #8b918e; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--green); }
    .member-name { font-size: 17px; overflow-wrap: anywhere; }
    .icon-button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--danger);
      font-size: 22px;
    }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
    input, select, button { font: inherit; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      min-height: 46px;
      border: 1px solid #aebbb4;
      border-radius: 10px;
      padding: 9px 11px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
    }
    button {
      min-height: 46px;
      border: 0;
      border-radius: 11px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .52; cursor: wait; }
    .secondary { background: var(--green-soft); color: var(--green-dark); }
    .primary {
      width: 100%;
      min-height: 58px;
      background: var(--green);
      color: #fff;
      font-size: 19px;
      box-shadow: 0 5px 16px rgba(23, 107, 69, .2);
    }
    details.panel { padding: 0; overflow: hidden; }
    summary {
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      list-style-position: inside;
    }
    .settings { border-top: 1px solid var(--line); padding: 15px; }
    .fields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: 13px; font-weight: 650; }
    .recalculate {
      margin-top: 16px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
    }
    .recalculate p { margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .danger-outline {
      width: 100%;
      border: 1px solid #e0a09a;
      background: #fff7f6;
      color: #8f241b;
    }
    .status {
      min-height: 24px;
      margin: 10px 3px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .status.error { color: var(--danger); font-weight: 650; }
    .results-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 4px 10px;
    }
    .results-head h2 { font-size: 22px; }
    .result-meta { color: var(--muted); font-size: 13px; text-align: right; }
    .games {
      overflow-x: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .pairing-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      font-size: clamp(14px, 3.8vw, 18px);
      line-height: 1.25;
    }
    .pairing-table th,
    .pairing-table td {
      padding: 8px 9px;
      border: 0;
      white-space: nowrap;
      text-align: left;
    }
    .pairing-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--paper);
      color: var(--ink);
      font-weight: 800;
      text-align: center;
    }
    .pairing-table tbody tr:nth-child(odd) { background: var(--paper); }
    .pairing-table tbody tr:nth-child(even) { background: #f0f1f1; }
    .pairing-table .game-number {
      position: sticky;
      left: 0;
      z-index: 1;
      background: inherit;
      font-weight: 800;
    }
    .pairing-table thead .game-number {
      z-index: 2;
      background: var(--paper);
    }
    .pairing-table .rest-cell {
      color: #725d14;
    }
    .empty {
      padding: 28px 16px;
      border: 1px dashed #aebbb4;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }
    [hidden] { display: none !important; }
    @media (max-width: 460px) {
      .fields { grid-template-columns: 1fr 1fr; }
      .fields label:last-child { grid-column: 1 / -1; }
      .panel { padding: 13px; border-radius: 14px; }
      .pairing-table th,
      .pairing-table td { padding: 7px 8px; }
    }
    @media print {
      body { background: #fff; }
      .app { width: 100%; max-width: none; padding: 0; }
      header, #controls, .status { display: none !important; }
      .results-head { margin-top: 0; }
      .games { overflow: visible; border: 0; }
      .pairing-table { font-size: 10px; }
      .pairing-table th,
      .pairing-table td { padding: 4px 5px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>テニス組み合わせ</h1>
      <p>ダブルスのペアと休みを公平に割り当てます</p>
    </header>

    <section id="controls">
      <div class="panel">
        <div class="panel-title">
          <h2>参加メンバー</h2>
          <span class="count" id="memberCount"></span>
        </div>
        <div class="member-list" id="memberList"></div>
        <form class="add-row" id="addForm">
          <input type="text" id="newMember" maxlength="30" autocomplete="name" placeholder="名前を入力" aria-label="追加するメンバー名">
          <button class="secondary" type="submit">追加</button>
        </form>
      </div>

      <details class="panel">
        <summary>詳細設定</summary>
        <div class="settings">
          <div class="fields">
            <label>コート面数
              <select id="courtCount"></select>
            </label>
            <label>試合数
              <input id="gameCount" type="number" min="1" max="30" value="12" inputmode="numeric">
            </label>
            <label>乱数シード
              <input id="seed" type="number" inputmode="numeric">
            </label>
          </div>
          <div class="recalculate">
            <p>通常は事前計算済みの組み合わせを使うため、待ち時間はありません。下のボタンを押した場合だけ、現在の人数・面数・試合数で組み合わせを計算し直します。端末によっては時間がかかります。</p>
            <button type="button" class="danger-outline" id="recalculateButton">この場で再計算する</button>
          </div>
        </div>
      </details>

      <button type="button" class="primary" id="generateButton">組み合わせを表示</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <section id="results" hidden>
      <div class="results-head">
        <h2>組み合わせ結果</h2>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <div class="games" id="games"></div>
    </section>
  </main>

    const DEFAULT_MEMBERS = ["福田", "羽鳥", "宮島", "加藤", "武本", "山口", "松元", "森戸", "三瀬"];
    const STORAGE_KEY = "tennis-pairing-state-v1";
    const sessionPairings = new Map();
    let members = loadState().members;

    const el = {
      list: document.getElementById("memberList"),
      count: document.getElementById("memberCount"),
      addForm: document.getElementById("addForm"),
      newMember: document.getElementById("newMember"),
      court: document.getElementById("courtCount"),
      gamesInput: document.getElementById("gameCount"),
      seed: document.getElementById("seed"),
      generate: document.getElementById("generateButton"),
      recalculate: document.getElementById("recalculateButton"),
      status: document.getElementById("status"),
      results: document.getElementById("results"),
      games: document.getElementById("games"),
      meta: document.getElementById("resultMeta")
    };

    function safeGetStorage() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
      catch (_) { return null; }
    }

    function loadState() {
      const saved = safeGetStorage();
      const validMembers = Array.isArray(saved?.members)
        ? saved.members.filter(item => item && typeof item.name === "string")
        : null;
      return {
        members: validMembers?.length
          ? validMembers.map(item => ({ name: item.name, active: item.active !== false }))
          : DEFAULT_MEMBERS.map(name => ({ name, active: true })),
        courts: Number(saved?.courts) || 0,
        games: Math.min(30, Math.max(1, Number(saved?.games) || 12))
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          members,
          courts: Number(el.court.value) || 0,
          games: clampInteger(el.gamesInput.value, 1, 30, 12)
        }));
      } catch (_) {}
    }

    function activeMembers() {
      return members.filter(member => member.active).map(member => member.name);
    }

    function renderMembers() {
      el.list.replaceChildren();
      members.forEach((member, index) => {
        const row = document.createElement("div");
        row.className = `member${member.active ? "" : " inactive"}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = member.active;
        checkbox.setAttribute("aria-label", `${member.name}が今日参加`);
        checkbox.addEventListener("change", () => {
          member.active = checkbox.checked;
          saveState();
          renderMembers();
          updateCourtOptions();
        });

        const name = document.createElement("span");
        name.className = "member-name";
        name.textContent = member.name;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "icon-button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `${member.name}を名簿から削除`);
        remove.addEventListener("click", () => {
          members.splice(index, 1);
          saveState();
          renderMembers();
          updateCourtOptions();
        });
        row.append(checkbox, name, remove);
        el.list.append(row);
      });
      el.count.textContent = `${activeMembers().length}人参加`;
    }

    function updateCourtOptions() {
      const count = activeMembers().length;
      const max = Math.max(1, Math.floor(count / 4));
      const previous = Number(el.court.value) || loadState().courts;
      el.court.replaceChildren();
      for (let court = 1; court <= max; court++) {
        const option = document.createElement("option");
        option.value = court;
        option.textContent = `${court}面`;
        el.court.append(option);
      }
      el.court.value = String(previous >= 1 && previous <= max ? previous : max);
      saveState();
    }

    function clampInteger(value, min, max, fallback) {
      const number = Number.parseInt(value, 10);
      return Number.isFinite(number) ? Math.min(max, Math.max(min, number)) : fallback;
    }

    function currentSettings() {
      return {
        names: activeMembers(),
        courts: Number(el.court.value),
        games: clampInteger(el.gamesInput.value, 1, 30, 12),
        seed: (Number(el.seed.value) || 0) >>> 0
      };
    }

    function validate(settings, needsTable = false) {
      if (settings.names.length < 4 || settings.names.length > 20) {
        throw new Error("参加者は4〜20人にしてください。");
      }
      if (!Number.isInteger(settings.courts) || settings.courts < 1 || settings.courts > Math.floor(settings.names.length / 4)) {
        throw new Error(`コート面数は1〜${Math.floor(settings.names.length / 4)}面にしてください。`);
      }
      if (needsTable && !getPairingTable(settings)) {
        throw new Error("この人数・面数の事前計算結果がありません。「この場で再計算する」を利用してください。");
      }
    }

    function mulberry32(seed) {
      return function() {
        let value = seed += 0x6D2B79F5;
        value = Math.imul(value ^ value >>> 15, value | 1);
        value ^= value + Math.imul(value ^ value >>> 7, value | 61);
        return ((value ^ value >>> 14) >>> 0) / 4294967296;
      };
    }

    function shuffled(array, random) {
      const result = array.slice();
      for (let index = result.length - 1; index > 0; index--) {
        const target = Math.floor(random() * (index + 1));
        [result[index], result[target]] = [result[target], result[index]];
      }
      return result;
    }

    function sample(array, count, random) {
      return shuffled(array, random).slice(0, count);
    }

    function pairingKey(settings) {
      return `${settings.names.length}_${settings.courts}`;
    }

    function getPairingTable(settings) {
      const key = pairingKey(settings);
      if (sessionPairings.has(key)) return sessionPairings.get(key);
      const compact = PRECOMPUTED[key];
      if (!compact) return null;
      return compact.map((game, gameIndex) => ({
        game: gameIndex + 1,
        courts: Array.from({ length: settings.courts }, (_, court) => ({
          court: court + 1,
          pair1: game[0].slice(court * 4, court * 4 + 2),
          pair2: game[0].slice(court * 4 + 2, court * 4 + 4)
        })),
        rest: game[1]
      }));
    }

    function showStatus(message = "", isError = false) {
      el.status.textContent = message;
      el.status.classList.toggle("error", isError);
    }

    function displayPairings(table, settings, source) {
      const names = shuffled(settings.names, mulberry32(settings.seed));
      const games = table.slice(0, settings.games);
      el.games.replaceChildren();
      const hasRest = games.some(game => game.rest.length > 0);
      const pairingTable = document.createElement("table");
      pairingTable.className = "pairing-table";

      const header = pairingTable.createTHead().insertRow();
      const gameHeader = document.createElement("th");
      gameHeader.className = "game-number";
      gameHeader.scope = "col";
      header.append(gameHeader);
      for (let courtIndex = 0; courtIndex < settings.courts; courtIndex++) {
        const courtName = String.fromCharCode(65 + courtIndex);
        for (const side of ["サ", "レ"]) {
          const cell = document.createElement("th");
          cell.scope = "col";
          cell.textContent = `${courtName}${side}`;
          header.append(cell);
        }
      }
      if (hasRest) {
        const restHeader = document.createElement("th");
        restHeader.scope = "col";
        restHeader.textContent = "休み";
        header.append(restHeader);
      }

      const body = pairingTable.createTBody();
      for (const game of games) {
        const row = body.insertRow();
        const gameNumber = document.createElement("th");
        gameNumber.scope = "row";
        gameNumber.className = "game-number";
        gameNumber.textContent = `試合${String(game.game).padStart(2, "0")}`;
        row.append(gameNumber);

        for (const court of game.courts) {
          for (const pair of [court.pair1, court.pair2]) {
            const cell = row.insertCell();
            cell.textContent = pair.map(index => names[index]).join(",");
          }
        }
        if (hasRest) {
          const rest = row.insertCell();
          rest.className = "rest-cell";
          rest.textContent = game.rest.map(index => names[index]).join(", ");
        }
      }
      el.games.append(pairingTable);

      el.meta.textContent = `${settings.names.length}人・${settings.courts}面・${games.length}試合\n${source}`;
      el.results.hidden = false;
      showStatus(`${source}から${games.length}試合を表示しました。`);
      el.results.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function pairKey(first, second) {
      return first < second ? `${first},${second}` : `${second},${first}`;
    }

    function mapValue(map, key) {
      return map.get(key) || 0;
    }

    function calculateCourtCost(players, pairHistory, gameHistory, samePair, sameGame) {
      const patterns = [
        [[players[0], players[1]], [players[2], players[3]]],
        [[players[0], players[2]], [players[1], players[3]]],
        [[players[0], players[3]], [players[1], players[2]]]
      ];
      let best = null;
      for (const [raw1, raw2] of patterns) {
        const pair1 = raw1.slice().sort((a, b) => a - b);
        const pair2 = raw2.slice().sort((a, b) => a - b);
        let cost = mapValue(pairHistory, pairKey(...pair1)) * samePair
          + mapValue(pairHistory, pairKey(...pair2)) * samePair;
        for (const first of raw1) {
          for (const second of raw2) {
            cost += mapValue(gameHistory, pairKey(first, second)) * sameGame;
          }
        }
        if (!best || cost < best.cost) best = { pair1, pair2, cost };
      }
      return best;
    }

    async function calculatePairings(settings, onProgress) {
      const numPlayers = settings.names.length;
      const numGames = settings.games;
      const numCourts = settings.courts;
      const decay = 0.9;
      const samePair = 2.0;
      const sameGame = 1.0;
      const sameRest = 10.0;
      const random = mulberry32(settings.seed);
      const pairHistory = new Map();
      const gameHistory = new Map();
      const consecutiveRest = Array(numPlayers).fill(0);
      const totalRest = Array(numPlayers).fill(0);
      const sinceRest = Array(numPlayers).fill(0);
      const players = Array.from({ length: numPlayers }, (_, index) => index);
      const restSlots = numPlayers - numCourts * 4;
      const averageRest = restSlots * numGames / numPlayers;
      const ideal = averageRest > 0 ? (numGames - averageRest) / averageRest : Infinity;
      let idealMin;
      let idealMax;
      if (ideal < 1) [idealMin, idealMax] = [1, 2];
      else if (ideal < 2) [idealMin, idealMax] = [1, Math.max(2, Math.floor(ideal) + 1)];
      else if (ideal < 3) [idealMin, idealMax] = [Math.max(1, Math.floor(ideal) - 1), Math.floor(ideal) + 1];
      else if (Number.isFinite(ideal)) [idealMin, idealMax] = [Math.max(2, Math.floor(ideal) - 1), Math.floor(ideal) + 1];
      else [idealMin, idealMax] = [Infinity, Infinity];
      const results = [];

      function makeCandidate() {
        const order = shuffled(players, random);
        const used = new Set();
        const courts = [];
        let cost = 0;
        for (let court = 0; court < numCourts; court++) {
          const available = order.filter(player => !used.has(player));
          if (available.length < 4) break;
          const selected = sample(available, 4, random);
          selected.forEach(player => used.add(player));
          const best = calculateCourtCost(selected, pairHistory, gameHistory, samePair, sameGame);
          cost += best.cost;
          courts.push({ court: court + 1, pair1: best.pair1, pair2: best.pair2 });
        }
        return { courts, rest: order.filter(player => !used.has(player)), cost };
      }

      function varianceCost(rest) {
        const counts = totalRest.map((count, index) => count + (rest.includes(index) ? 1 : 0));
        const average = counts.reduce((sum, count) => sum + count, 0) / numPlayers;
        return counts.reduce((sum, count) => sum + (count - average) ** 2, 0) * sameRest * 0.3;
      }

      function strictCost(candidate, gameIndex) {
        for (const player of candidate.rest) {
          if (consecutiveRest[player] > 0) return Infinity;
          if (gameIndex > 0 && sinceRest[player] === 0) return Infinity;
          if (gameIndex > 0 && Number.isFinite(ideal) && sinceRest[player] < idealMin) return Infinity;
        }
        let frequency = 0;
        if (Number.isFinite(ideal) && gameIndex > 0) {
          for (const player of players) {
            const resting = candidate.rest.includes(player);
            const interval = sinceRest[player] + (resting ? 0 : 1);
            if (resting && interval < idealMin) frequency += (idealMin - interval) ** 3 * sameRest * 100;
            else if (resting && interval > idealMax + 2) frequency += (interval - idealMax) ** 2 * sameRest * 1.5;
            else if (!resting && interval > idealMax) frequency += (interval - idealMax) ** 2 * sameRest;
          }
        }
        return candidate.cost + varianceCost(candidate.rest) + frequency;
      }

      function findBest(trials, score) {
        let best = null;
        for (let trial = 0; trial < trials; trial++) {
          const candidate = makeCandidate();
          const cost = score(candidate);
          if (Number.isFinite(cost) && (!best || cost < best.cost)) best = { ...candidate, cost };
        }
        return best;
      }

      for (let gameIndex = 0; gameIndex < numGames; gameIndex++) {
        for (const [key, value] of pairHistory) pairHistory.set(key, value * decay);
        for (const [key, value] of gameHistory) gameHistory.set(key, value * decay);
        onProgress(gameIndex + 1, numGames);
        await new Promise(resolve => setTimeout(resolve, 0));

        let best = findBest(Math.min(20000, 1000 * numPlayers), candidate => strictCost(candidate, gameIndex));
        if (!best) {
          const relaxedMin = Math.max(1, idealMin - 1);
          best = findBest(Math.min(10000, 500 * numPlayers), candidate => {
            if (candidate.rest.some(player =>
              consecutiveRest[player] > 0
              || (gameIndex > 0 && sinceRest[player] === 0)
              || (gameIndex > 0 && Number.isFinite(ideal) && sinceRest[player] < relaxedMin)
            )) return Infinity;
            return candidate.cost + varianceCost(candidate.rest);
          });
        }
        if (!best) {
          best = findBest(5000, candidate =>
            candidate.rest.some(player => consecutiveRest[player] > 0) ? Infinity : candidate.cost
          );
        }
        if (!best) {
          best = findBest(10000, candidate =>
            candidate.rest.some(player => consecutiveRest[player] >= 2) ? Infinity : candidate.cost
          );
        }
        if (!best) best = makeCandidate();

        results.push({ game: gameIndex + 1, courts: best.courts, rest: best.rest });
        for (const court of best.courts) {
          pairHistory.set(pairKey(...court.pair1), mapValue(pairHistory, pairKey(...court.pair1)) + 1);
          pairHistory.set(pairKey(...court.pair2), mapValue(pairHistory, pairKey(...court.pair2)) + 1);
          for (const first of court.pair1) {
            for (const second of court.pair2) {
              const key = pairKey(first, second);
              gameHistory.set(key, mapValue(gameHistory, key) + 1);
            }
          }
        }
        for (const player of players) {
          if (best.rest.includes(player)) {
            consecutiveRest[player] += 1;
            totalRest[player] += 1;
            sinceRest[player] = 0;
          } else {
            consecutiveRest[player] = 0;
            sinceRest[player] += 1;
          }
        }
      }
      return results;
    }

    el.addForm.addEventListener("submit", event => {
      event.preventDefault();
      const name = el.newMember.value.trim();
      if (!name) return;
      members.push({ name, active: true });
      el.newMember.value = "";
      saveState();
      renderMembers();
      updateCourtOptions();
      el.newMember.focus();
    });

    el.court.addEventListener("change", saveState);
    el.gamesInput.addEventListener("change", () => {
      el.gamesInput.value = clampInteger(el.gamesInput.value, 1, 30, 12);
      saveState();
    });

    el.generate.addEventListener("click", () => {
      try {
        const settings = currentSettings();
        validate(settings, true);
        const table = getPairingTable(settings);
        displayPairings(table, settings, sessionPairings.has(pairingKey(settings)) ? "この場で再計算した結果" : "事前計算済みデータ");
      } catch (error) {
        showStatus(error.message, true);
      }
    });

    el.recalculate.addEventListener("click", async () => {
      const settings = currentSettings();
      try {
        validate(settings);
        const confirmed = window.confirm(
          `${settings.names.length}人・${settings.courts}面・${settings.games}試合をこの端末で計算します。\n端末によっては時間がかかります。続けますか？`
        );
        if (!confirmed) return;
        el.recalculate.disabled = true;
        el.generate.disabled = true;
        showStatus("計算を開始します…");
        const table = await calculatePairings(settings, (current, total) => {
          showStatus(`試合 ${current}/${total} を計算中…`);
        });
        sessionPairings.set(pairingKey(settings), table);
        displayPairings(table, settings, "この場で再計算した結果");
      } catch (error) {
        showStatus(`再計算に失敗しました: ${error.message}`, true);
      } finally {
        el.recalculate.disabled = false;
        el.generate.disabled = false;
      }
    });

    const initial = loadState();
    el.gamesInput.value = initial.games;
    el.seed.value = String((Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0);
    renderMembers();
    updateCourtOptions();
  </script>
</body>
</html>
